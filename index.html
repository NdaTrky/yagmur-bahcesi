<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yağmur Bahçesi | Oynanabilir prototip</title>
    <meta name="description" content="Yağmur Bahçesi, Unity ve C# ile geliştirilmiş bir 2D keşif oyunu prototipi.">
    <link rel="icon" href="TemplateData/favicon.ico">
    <style>
        * { box-sizing: border-box; }
        body { margin:0; color:#20372e; background:#f0f5e9; font:1rem/1.55 system-ui,sans-serif; }
        main { width:min(1120px, calc(100% - 32px)); margin:25px auto; }
        h1 { margin:0; font:600 clamp(2rem,5vw,3.3rem)/1.1 Georgia,serif; letter-spacing:-.045em; }
        p { margin:.45rem 0; }
        a { color:#254f3a; }
        header { margin-bottom:18px; }
        .screen { position:relative; display:grid; place-items:center; aspect-ratio:16/9; overflow:hidden; background:#d6e5ce; border:1px solid #aac4a2; border-radius:14px; }
        canvas { width:100%; height:100%; display:block; }
        .overlay { position:absolute; inset:0; display:grid; align-content:center; justify-items:center; text-align:center; padding:14px; background:#e2eddc; }
        [hidden] { display:none !important; }
        button { border:0; border-radius:8px; padding:.62rem .98rem; background:#255c43; color:white; font:700 .95rem system-ui,sans-serif; cursor:pointer; }
        button:hover { background:#184932; }
        button:focus-visible,a:focus-visible { outline:3px solid #256e51; outline-offset:4px; }
        .info { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:12px 0; }
        #load { max-width:40ch; }
    </style>
</head>
<body>
<main>
    <header><h1>Yağmur Bahçesi</h1><p>Yağmurla filizleri büyüt, yaprak tekneyi yüzdür ve hayvan dostlarını keşfet.</p></header>
    <div class="screen">
        <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Yağmur Bahçesi oyun alanı" hidden></canvas>
        <div class="overlay" id="overlay">
            <button type="button" id="start">Oyunu başlat</button>
            <p id="load" role="status">Tarayıcı prototipi · Yaklaşık 19 MB</p>
        </div>
    </div>
    <div class="info">
        <p><a href="https://github.com/NdaTrky/yagmur-bahcesi">GitHub kaynak kodu</a> · Masaüstünde fare ile dokun veya sürükle.</p>
        <button type="button" id="fullscreen" hidden>Tam ekran</button>
    </div>
</main>
<script>
    const canvas = document.querySelector('#game');
    const overlay = document.querySelector('#overlay');
    const start = document.querySelector('#start');
    const status = document.querySelector('#load');
    const fullscreen = document.querySelector('#fullscreen');
    function showError() {
        canvas.hidden = true;
        overlay.hidden = false;
        status.textContent = 'Oyun yüklenemedi. WebGL destekleyen bir masaüstü tarayıcıda sayfayı yeniden açıp deneyebilirsin.';
    }
    start.addEventListener('click', () => {
        start.hidden = true;
        canvas.hidden = false;
        status.textContent = 'Oyun yükleniyor…';
        const files = 'Build/yagmur-bahcesi-web';
        const script = document.createElement('script');
        script.src = files + '.loader.js';
        script.onerror = showError;
        script.onload = () => {
            createUnityInstance(canvas, {
                dataUrl: files + '.data.unityweb',
                frameworkUrl: files + '.framework.js.unityweb',
                codeUrl: files + '.wasm.unityweb',
                streamingAssetsUrl: 'StreamingAssets',
                companyName: 'Rain Garden Development',
                productName: 'Yagmur Bahcesi',
                productVersion: '0.2.0',
                devicePixelRatio: 1,
                showBanner: (_message, type) => { if (type === 'error') showError(); },
            }, value => { status.textContent = 'Yükleniyor: %' + Math.round(value * 100); })
            .then(game => {
                overlay.hidden = true;
                status.textContent = 'Oyun hazır.';
                fullscreen.hidden = false;
                fullscreen.addEventListener('click', () => game.SetFullscreen(1));
            })
            .catch(showError);
        };
        document.body.append(script);
    });
</script>
</body>
</html>
